name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # ตรวจไวยากรณ์ก่อน เพื่อให้ล้มเร็วโดยไม่ต้องรอ MySQL
  # --------------------------------------------------------------------------
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: ตรวจไวยากรณ์ PHP ทุกไฟล์
        run: |
          find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: แคช Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: ติดตั้ง dependencies
        run: composer install --prefer-dist --no-progress

      - name: WordPress Coding Standards
        run: composer run lint

  # --------------------------------------------------------------------------
  # ตรวจ JavaScript ด้วย ESLint (ปลั๊กอินใช้ vanilla JS ไม่มีขั้นตอน build)
  # --------------------------------------------------------------------------
  javascript:
    name: JavaScript (lint + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm install --no-audit --no-fund

      - name: ตรวจไวยากรณ์
        run: node --check assets/js/curriculum-duplicator.js

      - name: ESLint
        run: npm run lint

      - name: รันชุดทดสอบบน DOM จำลองของ Course Builder
        run: npm test

      - name: ตรวจว่า Playwright E2E suite โหลดได้
        run: npm run test:e2e:list

  # --------------------------------------------------------------------------
  # ไฟล์แปลภาษาต้องตรงกับซอร์สเสมอ ไม่ใช่ตามหลังไปหลายคอมมิต
  # --------------------------------------------------------------------------
  i18n:
    name: ตรวจไฟล์แปลภาษา
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: .pot ต้องตรงกับข้อความในซอร์ส
        run: python3 bin/make-pot.py --check

      - name: .mo ต้องตรงกับ .po ที่ commit ไว้
        run: python3 bin/compile-mo.py --check languages/*.po

  # --------------------------------------------------------------------------
  # Unit test — ไม่ต้องมี Tutor LMS ใช้ post type จำลองจาก TLCD_Seeder
  # --------------------------------------------------------------------------
  unit:
    name: Unit (PHP ${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wp: '6.4'
          - php: '8.1'
            wp: 'latest'
          - php: '8.3'
            wp: 'latest'
          - php: '8.3'
            wp: 'trunk'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip
          coverage: none
          tools: composer

      - name: ติดตั้ง dependencies
        run: composer install --prefer-dist --no-progress

      - name: ติดตั้งชุดทดสอบของ WordPress
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: รัน unit test
        run: composer run test:unit

  # --------------------------------------------------------------------------
  # Integration test — ติดตั้ง Tutor LMS จริงจาก wordpress.org
  #
  # ทดสอบสิทธิ์ผู้สอน (can_user_manage) ซึ่งทดสอบด้วย mock ไม่ได้จริง
  # และยืนยันว่า post type / meta key ที่ปลั๊กอินคาดหวังยังตรงกับของจริง
  # --------------------------------------------------------------------------
  integration:
    name: Integration (Tutor LMS ${{ matrix.tutor }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wp: 'latest'
            tutor: '3.7.0'
          - php: '8.3'
            wp: 'latest'
            tutor: '4.0.2'
          - php: '8.3'
            wp: 'latest'
            tutor: 'trunk'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip
          coverage: none
          tools: composer

      - name: ติดตั้ง dependencies
        run: composer install --prefer-dist --no-progress

      - name: ติดตั้งชุดทดสอบของ WordPress
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: ดาวน์โหลด Tutor LMS ${{ matrix.tutor }}
        run: |
          set -euo pipefail
          PLUGIN_DIR="${TMPDIR:-/tmp}/wordpress/wp-content/plugins"
          mkdir -p "$PLUGIN_DIR"
          cd "$PLUGIN_DIR"

          if [ "${{ matrix.tutor }}" = "trunk" ]; then
            URL="https://downloads.wordpress.org/plugin/tutor.zip"
          else
            URL="https://downloads.wordpress.org/plugin/tutor.${{ matrix.tutor }}.zip"
          fi

          echo "ดาวน์โหลด $URL"
          curl -sSL -o tutor.zip "$URL"
          unzip -q tutor.zip
          rm tutor.zip

          echo "TUTOR_PLUGIN_FILE=$PLUGIN_DIR/tutor/tutor.php" >> "$GITHUB_ENV"

      - name: แสดงเวอร์ชัน Tutor LMS ที่ติดตั้ง
        run: grep -m1 -i '^ \* Version:' "$TUTOR_PLUGIN_FILE" || true

      - name: รัน integration test
        run: composer run test:integration
        env:
          TUTOR_PLUGIN_FILE: ${{ env.TUTOR_PLUGIN_FILE }}

      - name: รัน unit test ซ้ำโดยมี Tutor LMS อยู่ด้วย
        run: composer run test:unit
        env:
          TUTOR_PLUGIN_FILE: ${{ env.TUTOR_PLUGIN_FILE }}

  # --------------------------------------------------------------------------
  # สร้างไฟล์ ZIP สำหรับติดตั้ง เมื่อทุกอย่างผ่าน
  # --------------------------------------------------------------------------
  build:
    name: Build ZIP
    runs-on: ubuntu-latest
    needs: [ unit, integration, javascript, i18n ]

    steps:
      - uses: actions/checkout@v4

      - name: สร้าง ZIP
        run: bash bin/build-zip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tutor-lms-curriculum-duplicator
          path: dist/tutor-lms-curriculum-duplicator.zip
          retention-days: 30
