name: Build & Release

# Releases are cut from a *tested* commit, not from whatever last landed on
# main. The CI workflow runs first; only when it reports success for a push to
# main does this workflow wake up, and it then builds, tags and publishes the
# exact commit that suite ran against — github.event.workflow_run.head_sha —
# rather than the current tip of main, which may already have moved on.
#
# One thing is worth knowing about the shape below.
#
# The decision to release is a job, not a job-level `if:`. An `if:` that says no
# produces a job with conclusion "skipped", zero steps, no log and no
# annotation: the answer is correct and completely invisible, which cost real
# time the first time it happened. The commit that introduced this pipeline
# quoted the opt-out marker while documenting it, so the gate correctly opted
# that commit out of its own release — and explained nothing, leaving an API dig
# as the only way to find out why. The gate job below always runs, prints every
# condition with the value it was given, and publishes the verdict as an
# annotation on the run.
#
# Everything guarding main lives in the CI workflow — PHP syntax and WPCS across
# the supported PHP range, ESLint plus the jsdom suite, the .pot/.mo freshness
# checks, the WordPress unit matrix and the seeded integration matrix against
# three Tutor LMS releases — so this single `workflow_run` trigger really does
# wait for every check this repository has. There is no second workflow to
# cross-check, unlike the sibling plugins where Lint is its own workflow.
#
# Skip a release for a particular commit by putting [skip release] in its
# message. Anything else pushed to main that passes CI gets one.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Runs unconditionally, so that "no release" is always an explained outcome.
  # ---------------------------------------------------------------------------
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest

    # Deciding is all this job does: it reads the event payload it was handed
    # and writes two outputs. It needs none of the `contents: write` granted at
    # the top of the file, so it drops it.
    permissions:
      actions: read

    outputs:
      release: ${{ steps.decide.outputs.release }}
      sha: ${{ steps.decide.outputs.sha }}

    steps:
      - name: Evaluate the release conditions
        id: decide
        shell: bash
        # Every payload field reaches the script through the environment and is
        # read from there. None is interpolated into the script body: a commit
        # message is attacker-supplied text, and `${{ ... }}` inside `run:` is
        # pasted in before bash ever sees the result, so a message containing a
        # quote and a semicolon would become commands the runner executes with
        # this workflow's token.
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          # All of these are set by the runner (an absent payload field arrives
          # as an empty string). Defaulted anyway so that this script can be
          # pulled out of the file and exercised on its own, which is how the
          # decision table it implements is tested.
          : "${EVENT:=}" "${CONCLUSION:=}" "${TRIGGER_EVENT:=}" "${BRANCH:=}" "${MESSAGE:=}" "${SHA:=}"
          : "${GITHUB_OUTPUT:=/dev/null}" "${GITHUB_STEP_SUMMARY:=/dev/null}"

          # Every exit from this script goes through verdict(), so a run can
          # never finish without recording both outputs and stating a reason.
          # ::notice:: puts that reason on the run's summary page, which is
          # where a release that did not happen used to show nothing at all.
          verdict() {
            local release="$1" reason="$2" title
            {
              echo "release=${release}"
              echo "sha=${SHA}"
            } >> "$GITHUB_OUTPUT"

            if [ "$release" = 'true' ]; then
              title='Releasing'
            else
              title='No release'
            fi
            echo "::notice title=${title}::${reason}"
            {
              echo "### ${title}"
              echo
              echo "${reason}"
              echo
              echo "| output | value |"
              echo "| --- | --- |"
              echo "| release | \`${release}\` |"
              echo "| sha | \`${SHA:-none}\` |"
            } >> "$GITHUB_STEP_SUMMARY"

            echo
            echo "Verdict: release=${release} — ${reason}"
            exit 0
          }

          reject() { verdict false "$1"; }

          # Only the subject is echoed: a commit message can be a paragraph.
          # The opt-out test further down still reads the whole message.
          subject=${MESSAGE%%$'\n'*}

          echo "Inputs"
          echo "  github.event_name                         = ${EVENT}"
          echo "  workflow_run.conclusion                   = ${CONCLUSION:-none}"
          echo "  workflow_run.event                        = ${TRIGGER_EVENT:-none}"
          echo "  workflow_run.head_branch                  = ${BRANCH:-none}"
          echo "  workflow_run.head_commit.message (line 1) = ${subject:-none}"
          echo "  release SHA                               = ${SHA:-none}"
          echo
          echo "Conditions"

          if [ -z "$SHA" ]; then
            echo "FAIL  no head SHA in the event payload."
            reject 'The event carried no head SHA, so there is no commit to release.'
          fi
          echo "PASS  a release SHA is present: ${SHA}"

          # A person asking for a release by hand is the override, and being able
          # to override is the point of the button.
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            echo "PASS  github.event_name is workflow_dispatch — a person asked for this"
            echo "      release, so the workflow_run conditions do not apply."
            verdict true "Manual dispatch: releasing ${SHA}."
          fi
          echo "PASS  github.event_name is ${EVENT}, so every condition below applies"

          # CI said so, and nothing else may.
          if [ "$CONCLUSION" != 'success' ]; then
            echo "FAIL  workflow_run.conclusion is '${CONCLUSION:-none}', not 'success'."
            reject "CI concluded '${CONCLUSION:-none}' for ${SHA}; a commit whose tests did not pass is not released."
          fi
          echo "PASS  workflow_run.conclusion == success"

          # CI also runs for pull requests, where head_branch is the source
          # branch and head_sha an ephemeral merge commit — never releasable. A
          # PR opened *from* main would slip past the branch check below, so it
          # is excluded on its own.
          if [ "$TRIGGER_EVENT" = 'pull_request' ]; then
            echo "FAIL  workflow_run.event is 'pull_request'."
            reject "CI ran for a pull request (head ${SHA}), whose head commit exists only for the run; nothing is released from one."
          fi
          echo "PASS  workflow_run.event is '${TRIGGER_EVENT:-none}', not 'pull_request'"

          if [ "$BRANCH" != 'main' ]; then
            echo "FAIL  workflow_run.head_branch is '${BRANCH:-none}', not 'main'."
            reject "CI ran on '${BRANCH:-none}'; releases are cut from main only."
          fi
          echo "PASS  workflow_run.head_branch == main"

          # The escape hatch. Note that the marker is looked for in the message
          # of the commit being released, so a commit message that documents the
          # marker opts that commit out — as the very first run of this pipeline
          # discovered, silently.
          case "$MESSAGE" in
            *'[skip release]'*)
              echo "FAIL  the commit message contains the opt-out marker:"
              printf '%s\n' "$MESSAGE" | sed 's/^/        /'
              reject "The commit message of ${SHA} asks for no release: \"${subject}\"."
              ;;
          esac
          echo "PASS  the commit message does not ask to skip the release"

          verdict true "Every condition met: releasing ${SHA} — \"${subject}\"."

  # ---------------------------------------------------------------------------
  # Build, tag and publish exactly the commit the gate approved.
  # ---------------------------------------------------------------------------
  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest

    env:
      # The single source of truth for this run, decided by the gate and used by
      # checkout, version computation, tag and release alike, so the release can
      # never end up attached to a different commit than the one that was tested.
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm the checkout
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SHA}" ]; then
            echo "The gate approved a release but produced no SHA; refusing." >&2
            exit 1
          fi
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_SHA" ]; then
            echo "Checked out ${head} but expected ${RELEASE_SHA}; refusing to release." >&2
            exit 1
          fi
          echo "Releasing ${head}"
          git log -1 --format='%h %s'

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail

          raw=$(grep -iE '^[[:space:]]*\*[[:space:]]*Version:' tutor-lms-curriculum-duplicator.php | head -1 | sed -E 's/.*[Vv]ersion:[[:space:]]*//' | tr -d '[:space:]')

          if [ -z "$raw" ]; then
            echo "No Version header found in tutor-lms-curriculum-duplicator.php; aborting." >&2
            exit 1
          fi

          # Validate the whole header value instead of grepping three digits out
          # of it — which is what this step used to do, and which silently turned
          # a malformed header into a plausible-looking tag: "1.1.2-dev" became
          # 1.1.2, "v1.2.3" became 1.2.3, and "Version: see readme (1.0)" became
          # nothing at all. bin/build-zip.sh has always read the header whole;
          # this now matches it. A header nobody can parse means the tree is not
          # in a releasable state, and there is deliberately no default to fall
          # back to: guessing a version would publish a release nobody asked for.
          if ! printf '%s' "$raw" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Version header '${raw}' is not semver; aborting." >&2
            exit 1
          fi

          # A pre-release or build suffix on the header means "this version is
          # not released yet", not "release a version called 1.2.0-dev". Strip it
          # deliberately: the release, the tag and every stamped file use the
          # numeric core only, so a tag like v1.2.0-dev can never be created and
          # the suffix never reaches a site's plugin list.
          current=${raw%%[-+]*}
          if [ "$current" != "$raw" ]; then
            echo "Header '${raw}' is a pre-release; releasing its core ${current}."
          fi

          latest_tag=$(git tag --list 'v*' --sort=-v:refname | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || true)
          echo "header=${raw}  core=${current}  latest_tag=${latest_tag:-none}"

          if [ -z "${latest_tag}" ]; then
            # First release: the header is the version.
            next="$current"
          else
            higher=$(printf '%s\n%s\n' "$current" "$latest_tag" | sort -V | tail -1)
            if [ "$higher" = "$current" ] && [ "$current" != "$latest_tag" ]; then
              # A human bumped the header past the last tag: honour it, which is
              # how a MINOR or MAJOR release is requested. Bumping the header to
              # 1.2.0-dev during development asks for 1.2.0 next.
              next="$current"
            else
              # Otherwise auto-bump the PATCH from the newest tag. This is also
              # the path taken when the header still names an already-released
              # version, with or without a suffix.
              IFS=. read -r MA MI PA <<< "$latest_tag"
              next="${MA}.${MI}.$((PA + 1))"
            fi
          fi

          if ! printf '%s' "$next" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Computed version '$next' is not valid semver; aborting." >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            existing=$(git rev-list -n 1 "v$next")
            if [ "$existing" != "$RELEASE_SHA" ]; then
              echo "Tag v$next already exists at ${existing}, which is not ${RELEASE_SHA}; aborting." >&2
              exit 1
            fi
          fi

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (tag v$next)"

      - name: Stamp version into the plugin
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail

          # Plugin header and the runtime constant. The constant sed is anchored
          # on the quoted name, so TLCD_MIN_TUTOR_VERSION,
          # TLCD_TESTED_TUTOR_VERSION and TLCD_TESTED_TUTOR_BRANCH — which
          # describe Tutor LMS, not this plugin — cannot match it. The value
          # pattern is [^']* rather than [0-9.]* on purpose: the constant may
          # currently hold a pre-release string such as 1.2.0-dev, and a
          # digits-only pattern would leave the suffix behind.
          sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:[[:space:]]*).*/\1${NEXT}/" tutor-lms-curriculum-duplicator.php
          sed -i -E "s/(define\([[:space:]]*'TLCD_VERSION',[[:space:]]*')[^']*(')/\1${NEXT}\2/" tutor-lms-curriculum-duplicator.php

          # readme.txt is what WordPress shows as the installed version.
          # Anchored at column 0 so the "= 1.1.2 =" changelog headings survive.
          sed -i -E "s/^(Stable tag:[[:space:]]*).*/\1${NEXT}/" readme.txt

          # The translation template and the Thai catalogue carry the version in
          # their Project-Id-Version header, and bin/make-pot.py is what renders
          # that header — stamping the .pot without it would make the CI check
          # "the .pot must match the source" disagree with itself.
          #
          # The trailing character class is [0-9A-Za-z.+-], not [0-9.]: a header
          # left at 1.2.0-dev must be replaced whole, and a digits-only pattern
          # would refuse to match it at all and leave the old version in place.
          sed -i -E "s/(Project-Id-Version: Tutor LMS Curriculum Duplicator )[0-9][0-9A-Za-z.+-]*/\1${NEXT}/" languages/tutor-lms-curriculum-duplicator.pot
          sed -i -E "s/(Project-Id-Version: Tutor LMS Curriculum Duplicator )[0-9][0-9A-Za-z.+-]*/\1${NEXT}/" languages/tutor-lms-curriculum-duplicator-th.po
          sed -i -E "s/(def render\(entries, version=')[0-9][0-9A-Za-z.+-]*(')/\1${NEXT}\2/" bin/make-pot.py

          # package.json / package-lock.json hold the dev tooling's copy of the
          # same number. Rewritten in place with count-limited substitutions:
          # the first "version" in package.json is the top level one, and the
          # first two in the lock file are the root and packages[""] entries.
          # Every dependency uses its own key name, so none can be hit. Loading
          # and re-dumping the JSON would reformat files npm wrote with tabs.
          python3 - "$NEXT" <<'PY'
          import json
          import re
          import sys

          next_version = sys.argv[1]
          pattern = re.compile(r'("version":\s*")[^"]*(")')

          for path, count in (('package.json', 1), ('package-lock.json', 2)):
              with open(path, encoding='utf-8') as handle:
                  text = handle.read()

              stamped, made = pattern.subn(r'\g<1>%s\g<2>' % next_version, text, count=count)

              if made != count:
                  sys.exit('%s: replaced %d "version" keys, expected %d' % (path, made, count))

              with open(path, 'w', encoding='utf-8') as handle:
                  handle.write(stamped)

              # A broken JSON file would only surface much later, on npm ci.
              json.loads(stamped)
          PY

          # languages/*.mo is committed and CI proves it matches the .po, so the
          # release does not need to generate translations from scratch — but the
          # .po header was just rewritten, and the .mo embeds that header, so the
          # catalogue is recompiled exactly the way `composer i18n:mo` does it.
          # Skipping this would ship a .mo announcing the previous version.
          python3 bin/compile-mo.py languages/tutor-lms-curriculum-duplicator-th.po

          # Every location must now agree, or the build is not what it claims.
          # Values are read and compared whole, so a leftover pre-release suffix
          # fails here instead of being grepped away into a version that looks
          # plausible.
          check() {
            local label="$1" found="$2"
            if [ "$found" != "$NEXT" ]; then
              echo "${label} is '${found}', expected '${NEXT}'." >&2
              exit 1
            fi
            echo "  ${label}: ${found}"
          }

          echo "Stamped ${NEXT}:"
          check 'plugin header' "$(grep -iE '^[[:space:]]*\*[[:space:]]*Version:' tutor-lms-curriculum-duplicator.php | head -1 | sed -E 's/.*[Vv]ersion:[[:space:]]*//' | tr -d '[:space:]')"
          check 'TLCD_VERSION' "$(grep -E "'TLCD_VERSION'" tutor-lms-curriculum-duplicator.php | head -1 | sed -E "s/.*'TLCD_VERSION',[[:space:]]*'([^']*)'.*/\1/")"
          check 'readme.txt Stable tag' "$(grep -E '^Stable tag:' readme.txt | head -1 | sed -E 's/^Stable tag:[[:space:]]*//' | tr -d '[:space:]')"
          check 'languages POT header' "$(grep -E 'Project-Id-Version:' languages/tutor-lms-curriculum-duplicator.pot | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' | head -1)"
          check 'languages th.po header' "$(grep -E 'Project-Id-Version:' languages/tutor-lms-curriculum-duplicator-th.po | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' | head -1)"
          check 'bin/make-pot.py default' "$(grep -E "def render\(entries, version=" bin/make-pot.py | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' | head -1)"
          check 'package.json' "$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          check 'package-lock.json root' "$(python3 -c "import json;print(json.load(open('package-lock.json'))['version'])")"
          check 'package-lock.json own package entry' "$(python3 -c "import json;print(json.load(open('package-lock.json'))['packages']['']['version'])")"

          # The .mo the zip will carry must be the .po's compiled form, and the
          # .pot must still be what bin/make-pot.py renders from the source.
          python3 bin/compile-mo.py --check languages/*.po
          python3 bin/make-pot.py --check

          # A stray sed must not be allowed to ship broken PHP.
          if command -v php >/dev/null 2>&1; then
            php -l tutor-lms-curriculum-duplicator.php
          fi

      - name: Show exactly what the stamp changed
        run: |
          set -euo pipefail
          git --no-pager diff --stat
          git --no-pager diff -- tutor-lms-curriculum-duplicator.php readme.txt

          # TLCD_MIN_TUTOR_VERSION / TLCD_TESTED_TUTOR_VERSION /
          # TLCD_TESTED_TUTOR_BRANCH describe which Tutor LMS releases this
          # plugin works with. A sed that swept them up would silently claim
          # support for a Tutor LMS version nobody tested, so they must not
          # appear on either side of the diff. Scoped to the one file that
          # defines them, so an unrelated change elsewhere that merely mentions
          # the names cannot trip this.
          if git --no-pager diff -U0 -- tutor-lms-curriculum-duplicator.php | grep -E '^[+-][^+-].*TLCD_(MIN_TUTOR_VERSION|TESTED_TUTOR_VERSION|TESTED_TUTOR_BRANCH)'; then
            echo "The stamp touched a Tutor LMS compatibility constant; refusing to release." >&2
            exit 1
          fi
          echo "Tutor LMS compatibility constants untouched:"
          grep -E "'TLCD_(MIN_TUTOR_VERSION|TESTED_TUTOR_VERSION|TESTED_TUTOR_BRANCH)'" tutor-lms-curriculum-duplicator.php

      - name: Make build script executable
        run: chmod +x bin/build-zip.sh

      - name: Build plugin zip
        run: bash bin/build-zip.sh

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — refreshing assets."
            gh release upload "$TAG" dist/*.zip --clobber
          else
            echo "Creating release $TAG at ${RELEASE_SHA}."
            gh release create "$TAG" dist/*.zip \
              --target "$RELEASE_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Confirm the tag points at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          tagged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')
          if [ "$tagged" != "$RELEASE_SHA" ]; then
            echo "Tag ${TAG} resolves to ${tagged}, not ${RELEASE_SHA}." >&2
            exit 1
          fi
          echo "${TAG} → ${tagged}"
